name: release-latest

# Disposable test workflow: change release flags on a published release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag'
        required: true
      latest:
        description: 'true | false | none'
        required: true
      prerelease:
        description: 'true | false | none'
        required: false
        default: 'none'

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      LATEST: ${{ inputs.latest }}
      PRE: ${{ inputs.prerelease }}
    steps:
      - name: Set flags
        run: |
          set +e
          if [ "$LATEST" != none ]; then gh release edit "$TAG" --repo "$R" --latest="$LATEST"; echo "latest edit rc=$?"; fi
          if [ "$PRE" != none ]; then gh release edit "$TAG" --repo "$R" --prerelease="$PRE"; echo "prerelease edit rc=$?"; fi
          echo "-- latest now:"; gh api "repos/$R/releases/latest" --jq .tag_name
          gh api "repos/$R/releases/tags/$TAG" --jq '{tag_name,immutable,prerelease}'
